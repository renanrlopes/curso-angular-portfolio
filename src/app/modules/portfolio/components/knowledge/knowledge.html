<div class="container">
    <h2>Conhecimentos</h2>

    <ul class="knowledge-list">
        @for(item of arrayKnowledge(); track item){
        <li>
            <img [src]="item.src" [alt]="item.alt" [title]="item.label" loading="lazy" />
            <span>{{ item.label }}</span>
        </li>
        }
    </ul>
</div>
